# Publica el frontend en GitHub Pages (aparece en la sección "Deployments" como github-pages).
# Requisitos: Settings > Pages > Source: GitHub Actions
#             Settings > Secrets and variables > Actions > Variables > API_URL = URL pública de la API
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio con la URL de la API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta la variable de repositorio API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          mkdir -p _site
          cp -r frontend/. _site/
          printf 'window.RESERVAYA_API_BASE = "%s";\n' "${API_URL%/}" > _site/config.js
          cat _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
